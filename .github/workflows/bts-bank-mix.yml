# Narrow real-source research verification; no schedule, no secrets, no deploy.
name: Delta BTS departure bank and destination mix research
on:
  pull_request:
    paths:
      - "src/fleet_tracker/bts_bank_mix.py"
      - "src/fleet_tracker/bts_bank_sql_verify.py"
      - "tests/test_bts_bank_mix.py"
      - ".github/workflows/bts-bank-mix.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-source-and-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline tests before network download
        run: |
          python -m pip install pytest
          PYTHONPATH=src python -m pytest -q tests/test_bts_bank_mix.py
      - name: Download the same two official BTS 2025 archives to runner only
        run: |
          PYTHONPATH=src python -c 'from fleet_tracker.bts_delta_pilot import download; from pathlib import Path; download(1,Path("bts_1.zip")); download(7,Path("bts_7.zip"))'
      - name: Reconfirm official-source quality gates
        run: |
          PYTHONPATH=src python -m fleet_tracker.bts_delta_pilot \
            --january bts_1.zip --july bts_7.zip --output baseline.json
      - name: Analyze source by origin-local departure bank and shared destination
        run: |
          PYTHONPATH=src python -m fleet_tracker.bts_bank_mix \
            --january bts_1.zip --july bts_7.zip \
            --baseline baseline.json --output bank_mix.json
      - name: Independently reproduce every grouping in SQLite
        run: |
          PYTHONPATH=src python -m fleet_tracker.bts_bank_sql_verify \
            --january bts_1.zip --july bts_7.zip \
            --report bank_mix.json --output bank_mix_sql.json
      - name: Erase raw source ZIPs from runner
        if: always()
        run: rm -f bts_1.zip bts_7.zip
      - name: Archive only research aggregate outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bts-delta-bank-mix-aggregate-audit
          path: |
            bank_mix.json
            bank_mix_sql.json
          if-no-files-found: warn
          retention-days: 7
