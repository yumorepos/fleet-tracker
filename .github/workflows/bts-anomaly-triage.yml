# Bounded historical anomaly triage. No scheduled jobs or publishing.
name: BTS Delta 2025 timestamp anomaly triage
on:
  pull_request:
    paths:
      - "src/fleet_tracker/bts_anomaly_triage.py"
      - "tests/test_bts_anomaly_triage.py"
      - ".github/workflows/bts-anomaly-triage.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-anomaly-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned airport zones and offline test dependencies
        run: python -m pip install pytest airportsdata==20261103
      - name: Run synthetic checks before accessing original source
        run: |
          PYTHONPATH=src python -m pytest -q \
            tests/test_bts_tail_sequence.py \
            tests/test_bts_tail_sql_verify.py \
            tests/test_bts_anomaly_triage.py
      - name: Download original official-source Jan and July 2025 BTS ZIPs
        run: |
          PYTHONPATH=src python -c 'from fleet_tracker.bts_delta_pilot import download; from pathlib import Path; download(1,Path("bts_1.zip")); download(7,Path("bts_7.zip"))'
      - name: Check original source hashes and independently classify anomalies
        run: |
          PYTHONPATH=src python -m fleet_tracker.bts_anomaly_triage \
            --january bts_1.zip --july bts_7.zip \
            --output bts_anomaly_triage.json
      - name: Remove all original source ZIPs
        if: always()
        run: rm -f bts_1.zip bts_7.zip
      - name: Retain aggregate-only diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bts-delta-2025-anomaly-triage-aggregates
          path: bts_anomaly_triage.json
          if-no-files-found: error
          retention-days: 7
