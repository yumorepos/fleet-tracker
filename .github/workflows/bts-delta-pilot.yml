# Temporary, branch-scoped data-quality audit; no cron or production ingestion.
name: BTS Delta 2025 quality pilot
on:
  push:
    branches: [research/delta-bts-2025-pilot]
    paths:
      - src/fleet_tracker/bts_delta_pilot.py
      - tests/test_bts_delta_pilot.py
      - docs/BTS_DELTA_PILOT_2025.md
      - .github/workflows/bts-delta-pilot.yml
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline unit tests
        run: |
          python -m pip install pytest
          PYTHONPATH=src python -m pytest -q tests/test_bts_delta_pilot.py
      - name: Read official monthly ZIPs and audit DL rows
        run: |
          set +e
          PYTHONPATH=src python -m fleet_tracker.bts_delta_pilot --download --output bts_dl_2025_quality.json
          result=$?
          set -e
          if [ -f bts_dl_2025_quality.json ]; then python -m json.tool bts_dl_2025_quality.json; fi
          exit "$result"
      - name: Upload aggregate-only audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bts-dl-2025-quality
          path: bts_dl_2025_quality.json
          retention-days: 14
          if-no-files-found: warn
