# Fixed historical source audit; no schedule, external credentials, or deployment.
name: Delta BTS daily robustness and selection audit
on:
  pull_request:
    paths:
      - "src/fleet_tracker/bts_daily_robustness.py"
      - "src/fleet_tracker/bts_daily_sql_verify.py"
      - "tests/test_bts_daily_robustness.py"
      - ".github/workflows/bts-daily-robustness.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  daily-source-and-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline regression before public source download
        run: |
          python -m pip install pytest
          PYTHONPATH=src python -m pytest -q tests/test_bts_bank_mix.py tests/test_bts_daily_robustness.py
      - name: Download previously validated BTS archives
        run: |
          PYTHONPATH=src python -c 'from fleet_tracker.bts_delta_pilot import download; from pathlib import Path; download(1,Path("bts_1.zip")); download(7,Path("bts_7.zip"))'
      - name: Check original monthly source quality and denominators
        run: |
          PYTHONPATH=src python -m fleet_tracker.bts_delta_pilot \
            --january bts_1.zip --july bts_7.zip --output baseline.json
      - name: Reproduce previous origin-local bank and matched destination analysis
        run: |
          PYTHONPATH=src python -m fleet_tracker.bts_bank_mix \
            --january bts_1.zip --july bts_7.zip \
            --baseline baseline.json --output bank_mix.json
          PYTHONPATH=src python -m fleet_tracker.bts_bank_sql_verify \
            --january bts_1.zip --july bts_7.zip \
            --report bank_mix.json --output bank_mix_sql.json
      - name: Analyze daily robustness and sample selection
        run: |
          PYTHONPATH=src python -m fleet_tracker.bts_daily_robustness \
            --january bts_1.zip --july bts_7.zip \
            --baseline baseline.json --bank-report bank_mix.json \
            --output daily_robustness.json
      - name: Independently reproduce sensitivity checks in SQLite
        run: |
          PYTHONPATH=src python -m fleet_tracker.bts_daily_sql_verify \
            --january bts_1.zip --july bts_7.zip \
            --report daily_robustness.json --output daily_robustness_sql.json
      - name: Erase source ZIPs
        if: always()
        run: rm -f bts_1.zip bts_7.zip
      - name: Retain only aggregate research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delta-2025-daily-robustness-aggregate
          path: |
            daily_robustness.json
            daily_robustness_sql.json
          if-no-files-found: warn
          retention-days: 7
