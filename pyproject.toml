[project]
name = "fleet-tracker"
version = "0.1.0"
description = "Tracking current and historical fleets of major airlines, with per-aircraft history."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Yumo" }]

dependencies = [
    # duckdb pinned for Hive partitioning + APPEND behaviour, per docs/PLAN.md risk #5
    "duckdb>=1.1.3,<2",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
notebook = [
    # Optional. `uv sync --group notebook` to enable notebooks/.
    "pandas>=2.2.0",
    "matplotlib>=3.8.0",
    "jupyter>=1.1.0",
    "nbconvert>=7.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
